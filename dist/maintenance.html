<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="google-site-verification" content="EHA4zI2VBkRG4But1dVtvNmr6-eqrlka3PIE5ZOF2LI">
  <title>Cabinet Infirmier Graslin - Site en maintenance</title>
  <meta name="description" content="Le site du Cabinet Infirmier Graslin à Nantes est en cours de mise à jour.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: linear-gradient(-45deg, #e0f2fe, #f0fdfa, #e0f2fe, #f0fdfa);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 2.5rem;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      width: 90%;
      animation: fadeInUp 1.2s ease;
    }

    .title {
      font-size: 2.2rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #475569;
      line-height: 1.6;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #64748b;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="title">Cabinet Infirmier Graslin</h1>
    <p class="subtitle">
      Notre site est actuellement en cours de mise à jour.<br>
      Merci de votre patience, il sera bientôt disponible.
    </p>
    <div class="footer">
      Mise en ligne prévue le <strong>24 septembre 2025</strong>
    </div>
  </div>
</body>
</html>
